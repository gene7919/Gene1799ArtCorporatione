version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    ports:
      - "8083:8083"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  adobe:
    build:
      context: .
      dockerfile: Dockerfile.adobe
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./AdobeBatch/edge_profile_adobe:/app/edge_profile_adoge:ro
      - ./AdobeBatch/pdf_scaricati:/app/pdf_scaricati
      - ./logs/adobe:/app/logs
    healthcheck:
      test: ["CMD", "test", "-f", "/app/edge_profile_adoge/.lock"]
      interval: 20s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_volume:/root/.ollama
    gpus: all
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}

  electron:
    build:
      context: .
      dockerfile: Dockerfile.electron
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./src/suitev17/ui/ElectronApp:/app
      - ./logs/electron:/app/logs
    command: ["npm", "start"]

volumes:
  ollama_volume: