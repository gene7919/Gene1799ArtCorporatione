<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gene1799 Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #e4e6f0; font-family: 'Consolas', 'JetBrains Mono', monospace; font-size: 13px; }
        #terminal { width: 100%; height: 100vh; padding: 12px; overflow-y: auto; }
        .line { margin: 1px 0; white-space: pre-wrap; word-break: break-all; }
        .system { color: #00e5a0; } .error { color: #ef4444; } .warning { color: #fbbf24; }
        .info { color: #00c9ff; } .ai { color: #8b5cf6; } .user { color: #e4e6f0; }
        .input-row { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #161b22; border-top: 1px solid #30363d; }
        .prompt { padding: 8px 12px; color: #00e5a0; white-space: nowrap; }
        .input-row input { flex: 1; background: transparent; color: #e4e6f0; border: none; padding: 8px; font-family: inherit; font-size: 13px; outline: none; }
    </style>
</head>
<body>
    <div id="terminal">
        <div class="line system">Gene1799 Terminal v5.2.0</div>
        <div class="line system">Type commands. Prefix ai: for AI, agent:name:msg for agents.</div>
        <div class="line system">─────────────────────────────────────</div>
    </div>
    <div class="input-row">
        <span class="prompt">gene1799 $</span>
        <input id="cmd-input" autofocus onkeydown="if(event.key==='Enter'){sendCmd();event.preventDefault();}">
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const terminal = document.getElementById('terminal');
        
        function log(text, cls='system') {
            const div = document.createElement('div');
            div.className = `line ${cls}`;
            div.textContent = text;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function sendCmd() {
            const input = document.getElementById('cmd-input');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            log(`$ ${cmd}`, 'user');
            ipcRenderer.send('run-command', cmd);
        }
        
        ipcRenderer.on('terminal-output', (_, data) => log(data, 'system'));
        ipcRenderer.on('terminal-done', () => log('', 'info'));
    </script>
</body>
</html>
