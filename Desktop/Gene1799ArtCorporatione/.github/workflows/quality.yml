name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install Node dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint --if-present
    
    - name: TypeScript type checking
      run: npm -w frontend run type-check
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8
        if [ -f ai-agent/requirements.txt ]; then pip install -r ai-agent/requirements.txt; fi
    
    - name: Run Python linter
      run: |
        flake8 ai-agent --count --select=E9,F63,F7,F82 --show-source --statistics
        pylint ai-agent/*.py --disable=all --enable=E || true
    
    - name: Code coverage report
      run: npm run test -- --coverage --if-present || true
