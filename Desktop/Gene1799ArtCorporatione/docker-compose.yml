version: '3.8'
services:
  # === DATABASE ===
  mongodb:
    image: mongo:7.0
    container_name: gene1799-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongodb/data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: gene1799ultra2026

  # === BACKEND API ===
  backend:
    build: ./backend
    container_name: gene1799-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://admin:gene1799ultra2026@mongodb:27017/gene1799_v7
      GPU_SERVICE_URL: http://gpu-service:4000
      WEB3_SERVICE_URL: http://web3-service:8004
    depends_on:
      - mongodb

  # === GPU SERVICE (RTX 4070 Super) ===
  gpu-service:
    build: ./gpu-service
    container_name: gene1799-gpu
    restart: always
    ports:
      - "4000:4000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # === AZURE AI INTEGRATION ===
  azure-ai:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: gene1799-azure
    restart: always
    ports:
      - "8001:8001"
    command: python azure_ai_integration.py
    environment:
      AZURE_ENDPOINT: ${AZURE_ENDPOINT:-}
      AZURE_PROJECT_ID: ${AZURE_PROJECT_ID:-}

  # === CREATIVE CONTENT SERVICE ===
  creative-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: gene1799-creative
    restart: always
    ports:
      - "8002:8002"
    command: python creative-content-service/main.py
    volumes:
      - ./media:/app/media

  # === PUBLISHING PIPELINE ===
  publishing-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: gene1799-publishing
    restart: always
    ports:
      - "8003:8003"
    command: python publishing-service/main.py
    volumes:
      - ./media:/app/media

  # === WEB3 & NFT SERVICE ===
  web3-service:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: gene1799-web3
    restart: always
    ports:
      - "8004:8004"
    command: python web3-service/main.py
    environment:
      BASE_RPC_URL: https://mainnet.base.org
      TOKEN_CONTRACT: "0x63800f788e788e0d3a9cc0ce92a8e6c866f0f0f0"

  # === UNIFIED ORCHESTRATOR ===
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: gene1799-orchestrator
    restart: always
    ports:
      - "5050:5050"
    command: node orchestrator-unified.js
    depends_on:
      - gpu-service
      - azure-ai
      - creative-service
      - publishing-service
      - web3-service

  # === TELEGRAM BOT ===
  telegram-bot:
    build: ./telegram-bot
    container_name: gene1799-telegram
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHANNEL_ID: ${CHANNEL_ID:-}
      ADMIN_IDS: ${ADMIN_IDS:-}
      WEB3_SERVICE_URL: http://web3-service:8004
      TOKEN_CONTRACT: "0x63800f788e788e0d3a9cc0ce92a8e6c866f0f0f0"
    depends_on:
      - web3-service

  # === FRONTEND DASHBOARD ===
  frontend:
    build: ./frontend
    container_name: gene1799-frontend
    restart: always
    ports:
      - "3001:3000"
    depends_on:
      - backend
      - orchestrator
