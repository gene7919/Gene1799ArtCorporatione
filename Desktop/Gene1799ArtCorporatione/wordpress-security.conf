# ============================================================================
# .htaccess FILE CONFIGURATION
# Posizionare in: /public_html/.htaccess o /var/www/gene1799/.htaccess
# ============================================================================

<IfModule mod_rewrite.c>
RewriteEngine On
RewriteBase /

# Block direct access to WordPress files
RewriteRule ^wp-login\.php$ - [L]
RewriteRule ^wp-admin/$ - [L]
RewriteRule ^wp-admin/index\.php$ - [L]

# Protect wp-config.php
<Files wp-config.php>
Order allow,deny
Deny from all
</Files>

# Protect .htaccess
<Files .htaccess>
Order allow,deny
Deny from all
</Files>

# Protect sensitive files
<Files ~ "^\.">
Order allow,deny
Deny from all
</Files>

# Block execution of PHP in /uploads/
<Directory /var/www/gene1799/wp-content/uploads>
<IfModule mod_php.c>
php_flag engine off
</IfModule>
</Directory>

# Disable directory browsing
Options -Indexes

# Block SQL injection attempts
RewriteCond %{QUERY_STRING} (<|>|'|"|%0A|%0D|%13|%00) [NC]
RewriteRule .* - [F,L]

# Block XML-RPC requests (prevent brute force)
<Files xmlrpc.php>
Order allow,deny
Deny from all
</Files>

# Rate limiting for login attempts (~5 per second per IP)
<IfModule mod_ratelimit.c>
<Location /wp-login.php>
SetOutputFilter RATE_LIMIT
SetEnv rate-limit 5
</Location>
</IfModule>

</IfModule>

# ============================================================================
# SECURITY HEADERS
# ============================================================================

<IfModule mod_headers.c>
# Strict-Transport-Security (HSTS) - force HTTPS for 1 year
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

# Content Security Policy (CSP) - prevent XSS, injection attacks
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.ethers.io data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none';"

# X-Frame-Options - prevent clickjacking
Header always set X-Frame-Options "SAMEORIGIN"

# X-Content-Type-Options - prevent MIME type sniffing
Header always set X-Content-Type-Options "nosniff"

# X-XSS-Protection - enable browser XSS filter
Header always set X-XSS-Protection "1; mode=block"

# Referrer-Policy - limit referrer info
Header always set Referrer-Policy "strict-origin-when-cross-origin"

# Permissions-Policy - restrict browser features
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

# Remove Server header (hide WordPress)
Header always unset Server
Header always unset X-Powered-By
Header always unset X-AspNet-Version
Header always unset X-AspNetMvc-Version
</IfModule>

