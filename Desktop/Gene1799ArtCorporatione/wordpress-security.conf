# ============================================================================
# GITHUB SECURITY
# ============================================================================

1. Enable 2FA on GitHub.com/settings/security
2. Protect main branch: Settings > Branches > Add rule
   - Require pull request reviews before merging
   - Require status checks to pass
   - Dismiss stale pull request approvals

3. Add Secrets for GitHub Actions:
   - BOT_TOKEN (Telegram)
   - CHANNEL_ID (Telegram)
   - ADMIN_IDS (Telegram)
   - RENDER_API_KEY (for deployments)
   - PORKBUN_API_KEY (for DNS management)

4. Ensure .gitignore contains:
   - .env
   - .env.local
   - .env.*.local
   - node_modules/
   - dist/
   - build/
   - *.log
   - .DS_Store

5. Enable Dependabot:
   - Settings > Code security & analysis > Enable Dependabot alerts
   - Auto-merge security patches

