# Security Configuration for wp-config.php:

/**
 * GENE1799 Security Settings
 * Version: 1.0.0
 */

// Database prefix - NOT default 'wp_'
define('DB_CHARSET', 'utf8mb4');
define('DB_COLLATE', 'utf8mb4_unicode_ci');
// Note: $table_prefix = 'g1799_'; MUST be set BEFORE installation

// Disable file editing from WordPress admin
define('DISALLOW_FILE_EDIT', true);
define('DISALLOW_FILE_MODS', true);

// Force SSL for admin
define('FORCE_SSL_ADMIN', true);
define('FORCE_SSL_LOGIN', true);

// Update only via manual upload
define('AUTOMATIC_UPDATER_DISABLED', true);
define('WP_AUTO_UPDATE_CORE', false);

// Increase security keys
define('AUTH_KEY', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('SECURE_AUTH_KEY', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('LOGGED_IN_KEY', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('NONCE_KEY', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('AUTH_SALT', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('SECURE_AUTH_SALT', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('LOGGED_IN_SALT', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');
define('NONCE_SALT', 'REPLACE_WITH_SECURE_KEY_FROM_https://api.wordpress.org/secret-key/1.1/salt/');

// Increase cookie security
define('COOKIEHTTPONLY', true);
define('COOKIESECURE', true);
define('COOKIEPATH', '/');
define('SITECOOKIEPATH', '/');

// Disable script concatenation for better debugging
define('CONCATENATE_SCRIPTS', false);

// Memory limit for large uploads
define('WP_MEMORY_LIMIT', '256M');
define('WP_MAX_MEMORY_LIMIT', '512M');

// Mail configuration
define('WP_MAIL_SMTP_HOST', 'smtp.sendgrid.net');
define('WP_MAIL_SMTP_PORT', 587);
define('WP_MAIL_SMTP_USER', 'apikey');
define('WP_MAIL_SMTP_PASSWORD', 'REPLACE_WITH_SENDGRID_API_KEY');
define('WP_MAIL_FROM_NAME', 'GENE1799 ART CORPORATIONE');

// Disable REST API for unauthenticated users (optional)
define('WP_REST_AUTHENTICATION_CLASS', 'WP_REST_Authentication');

// Disable JSON user enumeration
if (!is_admin()) {
    if (!defined('ABSPATH')) {
        define('ABSPATH', dirname(__FILE__) . '/');
    }
    add_filter('rest_endpoints', function($endpoints) {
        if (isset($endpoints['/wp/v2/users'])) {
            unset($endpoints['/wp/v2/users']);
        }
        return $endpoints;
    });
}

