# ═══════════════════════════════════════════
# PARTE 1: .htaccess (metti nella root di WordPress)
# ═══════════════════════════════════════════

# BEGIN Security Headers
<IfModule mod_headers.c>
    # Previene clickjacking
    Header always set X-Frame-Options "SAMEORIGIN"
    
    # Previene MIME-type sniffing
    Header always set X-Content-Type-Options "nosniff"
    
    # Abilita XSS protection
    Header always set X-XSS-Protection "1; mode=block"
    
    # Referrer policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Permissions policy (blocca accesso a sensori non necessari)
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self), usb=()"
    
    # Content Security Policy per Web3 + WordPress
    Header always set Content-Security-Policy "\
        default-src 'self'; \
        script-src 'self' 'unsafe-inline' 'unsafe-eval' \
            https://cdn.ethers.io \
            https://unpkg.com \
            https://cdnjs.cloudflare.com \
            https://www.googletagmanager.com \
            https://www.google-analytics.com \
            https://*.zora.co; \
        style-src 'self' 'unsafe-inline' \
            https://fonts.googleapis.com; \
        font-src 'self' \
            https://fonts.gstatic.com; \
        img-src 'self' data: blob: \
            https://*.zora.co \
            https://*.superrare.com \
            https://*.crypto.com \
            https://ipfs.io \
            https://arweave.net \
            https://*.wp.com; \
        connect-src 'self' \
            https://mainnet.base.org \
            https://api.zora.co \
            https://api.dexscreener.com \
            https://api.simplehash.com \
            https://basescan.org \
            wss://*.infura.io \
            wss://*.alchemy.com; \
        frame-src 'self' \
            https://*.zora.co; \
        object-src 'none'; \
        base-uri 'self'; \
        form-action 'self'; \
    "

    # HSTS (solo se hai SSL attivo - IMPORTANTE per .mom)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
</IfModule>

# Blocca accesso a file sensibili
<FilesMatch "^(\.htaccess|\.htpasswd|wp-config\.php|readme\.html|license\.txt|xmlrpc\.php)$">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</FilesMatch>

# Blocca XML-RPC (usato per attacchi brute force)
<Files xmlrpc.php>
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
</Files>

# Blocca esecuzione PHP nella cartella uploads
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^wp-content/uploads/.*\.php$ - [F]
</IfModule>

# Blocca directory listing
Options -Indexes

# Blocca inclusione file da remoto
<IfModule mod_php.c>
    php_flag allow_url_include off
</IfModule>

# Limita dimensione upload (50MB)
LimitRequestBody 52428800

# Protezione hotlinking immagini
<IfModule mod_rewrite.c>
    RewriteEngine on
    RewriteCond %{HTTP_REFERER} !^$
    RewriteCond %{HTTP_REFERER} !^https?://(www\.)?gene1799artcorporatione\.mom [NC]
    RewriteCond %{HTTP_REFERER} !^https?://(www\.)?google\. [NC]
    RewriteCond %{HTTP_REFERER} !^https?://(www\.)?zora\.co [NC]
    RewriteRule \.(jpg|jpeg|png|gif|webp|svg)$ - [F,NC,L]
</IfModule>

# Rate limiting per wp-login.php
<IfModule mod_rewrite.c>
    RewriteEngine on
    RewriteCond %{REQUEST_METHOD} POST
    RewriteCond %{REQUEST_URI} ^/wp-login\.php$
    RewriteCond %{HTTP:X-Forwarded-For} ^(.*)$
    RewriteRule .* - [E=REMOTE_ADDR:%1]
</IfModule>

# END Security Headers

